name: Build and publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build"
        required: true
        type: string

  release:
    types: [published]

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: week-ahead-energy

permissions:
  contents: read

jobs:

  init:
    name: Initialize build
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      app_dir: ${{ steps.detect.outputs.app_dir }}
      version: ${{ steps.detect.outputs.version }}
      image_tags: ${{ steps.detect.outputs.image_tags }}

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect release type
        id: detect
        shell: bash
        run: |
          VERSION=$(grep '^version:' dao/config.yaml | awk '{print $2}')
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi
          echo "Release tag: ${RELEASE_TAG}"
          echo "Version:     ${VERSION}"
          if [[ "${RELEASE_TAG}" != "${VERSION}" ]]; then
            echo "ERROR: release tag '${RELEASE_TAG}' does not match dao/config.yaml: ${VERSION}"
            exit 1
          fi
          echo "app_dir=dao" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "image_tags<<EOF"
            echo "${VERSION}"
            echo "latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare multi-architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}


  build:
    name: Build ${{ matrix.arch }} image
    needs: init

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}

          image: ${{ matrix.image }}

          context: ${{ needs.init.outputs.app_dir }}

          container-registry: ghcr.io
          container-registry-username: ${{ github.repository_owner }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

          image-tags: ${{ needs.init.outputs.image_tags }}

          version: ${{ needs.init.outputs.version }}

          push: "true"

          cache-gha: "true"
          cache-gha-scope: ${{ needs.init.outputs.app_dir }}


  manifest:
    name: Publish multi-architecture manifest
    needs:
      - init
      - build

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      packages: write

    steps:

      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}

          image-name: ${{ env.IMAGE_NAME }}

          container-registry: ghcr.io
          container-registry-username: ${{ github.repository_owner }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

          image-tags: ${{ needs.init.outputs.image_tags }}